[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planifica-langchain"
version = "0.1.0"
description = "Sistema Multiagente Educativo Planifica con LangGraph Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-sdk>=0.1.0",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "langchain-community>=0.3.0",
    "google-auth>=2.0.0",
    "markitdown>=0.1.7",
    "pymongo>=4.6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
